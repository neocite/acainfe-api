services:
  mongo:
    image: mongo:8
    ports: ['27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
    ports: ['3000:3000']
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
